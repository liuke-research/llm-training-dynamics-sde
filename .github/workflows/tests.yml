name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run core tests (PyTorch tests skip when torch is absent)
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m llm_sde demo --steps 300 --out runs/ci_demo

  tiny-transformer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and tests
        run: python -m pip install -e ".[dev]"
      - name: Run all tests, including actual backpropagation
        run: python -m pytest -q
      - name: Tiny training smoke test
        run: python -m llm_sde train-demo --steps 80 --out runs/ci_tiny